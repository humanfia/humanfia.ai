# humanfia.ai. Built on every change, and deployed to GitHub Pages from main -- so a pull
# request finds out that a link is dead without anything being published.
#
# The same shape as humanfia/humanize's docs workflow, because it is the same VitePress
# site with the same checks on it.

name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `lastUpdated` reads each page's last commit, and a shallow clone has none.
          fetch-depth: 0

      # No version pinned here on purpose: the action reads `packageManager` from
      # package.json, so the version this repository is developed against is the version CI
      # installs, and there is one place to change it.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fails on a dead internal link, which is the point: a page moved without its inbound
      # links moving is a red build rather than a 404 somebody finds later.
      - name: Build
        run: pnpm build

      # VitePress checks that a link's page exists and stops there, so a `#fragment` written
      # the way GitHub would slugify it passes the build and silently drops the reader at the
      # top of the page. This is what catches that.
      - name: Every #fragment resolves
        run: pnpm check:anchors

      # The feed is written after the build's own link check has run, so nothing else looks at
      # it. This reads the feed and the client bundle: that every post is in it, that every link
      # in it was built, and that the router will let a click on it through rather than
      # answering with a 404 -- which is what it did until VITE_EXTRA_EXTENSIONS was set.
      - name: The feed is a feed, and its links work
        run: pnpm check:feed

      # The documentation is a site of its own and moves pages without telling this one, and
      # what it leaves behind answers 200 -- so neither the build nor the two checks above can
      # see a link that has gone stale. This fetches every one of them. It reads the sources
      # rather than the build, so it is last only because it is the one that needs the network.
      - name: Every link to the documentation reaches the page it names
        run: pnpm check:docs

      # `include-hidden-files` because VitePress writes a `.nojekyll` into the output, and this
      # action has excluded dotfiles by default since v4 -- which would drop it silently.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .vitepress/dist
          include-hidden-files: true

  deploy:
    name: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

<?xml version="1.0" encoding="UTF-8"?>
<!--
  The H from logo.svg, centred in a square with enough room to survive a 16px tab strip. A favicon
  cannot ask VitePress which theme is on, so it asks the operating system: ink and red on a light
  system, paper and a lifted red on a dark one. The gap under the circle is opened a little here
  (the circle sits two units higher) because at 16px the real one closes up into a smudge.
  (No double hyphen in an XML comment: a browser rejects the whole file over one.)
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="humanfia-favicon-title">
  <title id="humanfia-favicon-title">Humanfia</title>
  <style>
    .h { fill: #16161a; }
    .dot { fill: #d6331f; }
    @media (prefers-color-scheme: dark) {
      .h { fill: #ece6da; }
      .dot { fill: #ff5a43; }
    }
  </style>
  <g transform="translate(8 4) scale(0.5)">
    <path class="h" d="M0 0H24V50L96 26V108H72V55L24 71V108H0Z" transform="translate(0 4)"/>
    <circle class="dot" cx="84" cy="12" r="12"/>
  </g>
</svg>

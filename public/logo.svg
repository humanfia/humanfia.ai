<?xml version="1.0" encoding="UTF-8"?>
<!--
  The Humanfia H, light mode: ink on whatever it is put on, and the red circle in its slot.

  Four primitives on a 96 x 108 grid, drawn as two shapes. The left stem is the full height. The
  crossbar rises at one in three (18.4 degrees, the site's one diagonal) from the left stem to the
  right edge, and the right stem stands under it with its top cut on that same line, so the H is
  closed and balanced on its own. The circle is as wide as a stem, centred over the right stem and
  tangent to the cap line; the gap under it runs parallel to the cut. Take the circle away
  (logo-mark.svg) and nothing is missing: the diagonal points at the space where it was.

  The geometry is .vitepress/theme/home/logo.ts; every file that draws the H says the same numbers.
  (No double hyphen in here: XML forbids one in a comment and a browser drops the file over it.)
-->
<!-- No width/height on purpose: the nav sizes the mark by height and the hero by its box. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 108" role="img" aria-labelledby="humanfia-logo-title">
  <title id="humanfia-logo-title">Humanfia</title>
  <path class="h" fill="#16161a" d="M0 0H24V50L96 26V108H72V55L24 71V108H0Z"/>
  <circle class="dot" fill="#d6331f" cx="84" cy="12" r="12"/>
</svg>

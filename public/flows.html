<!doctype html>
<!-- /flows, without the slash. The catalogue is flows/index.md, built to /flows/, and with
     cleanUrls a bare /flows would be read as a page named flows.html that does not exist. Links
     to it were published while the pages lived in humanize's documentation, so this sends
     them on rather than to a 404. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Flows · Humanfia</title>
    <link rel="canonical" href="https://humanfia.ai/flows/" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=/flows/" />
    <script>location.replace('/flows/' + location.search + location.hash)</script>
  </head>
  <body>
    <p><a href="/flows/">Flows &rarr;</a></p>
  </body>
</html>
